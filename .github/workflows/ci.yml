name: starlineBot CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [18]
    steps:
      - uses: actions/checkout@v4
      - name: use node.js ${{matrix.node-version}}
        uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.node-version}}
      - name: create env file
        working-directory: ./
        run: |
          pwd
          touch .env
          echo NODE_ENV=${{ secrets.NODE_ENV }} >> .env
          echo TOKEN=${{ secrets.TOKEN }} >> .env
          echo CHANNEL_ID=${{ secrets.CHANNEL_ID }} >> .env
          echo DEV_CHANNEL_ID=${{ secrets.DEV_CHANNEL_ID }} >> .env
          echo PARTY_RECRUITMENT=${{ secrets.PARTY_RECRUITMENT }} >> .env
          echo DEV_PARTY_RECRUITMENT=${{ secrets.DEV_PARTY_RECRUITMENT }} >> .env
          echo ROLE_AUDITING_CHANNEL_ID=${{ secrets.ROLE_AUDITING_CHANNEL_ID }} >> .env
          echo DEV_ROLE_AUDITING_CHANNEL_ID=${{ secrets.DEV_ROLE_AUDITING_CHANNEL_ID }} >> .env
          echo GUILD_ROLE=${{ secrets.GUILD_ROLE }} >> .env
          echo DEV_GUILD_ROLE=${{ secrets.DEV_GUILD_ROLE }} >> .env
          echo GUILD_ID=${{ secrets.GUILD_ID }} >> .env
          echo DEV_GUILD_ID=${{ secrets.DEV_GUILD_ID }} >> .env
          echo GUILD_ADMIN_ROLE_ID=${{ secrets.GUILD_ADMIN_ROLE_ID }} >> .env
          echo DEV_GUILD_ADMIN_ROLE_ID=${{ secrets.DEV_GUILD_ADMIN_ROLE_ID }} >> .env
          echo GUILD_GUEST_ROLE_ID=${{ secrets.GUILD_GUEST_ROLE_ID }} >> .env
          echo DEV_GUILD_GUEST_ROLE_ID=${{ secrets.DEV_GUILD_GUEST_ROLE_ID }} >> .env
          cat .env

      - run: npm ci
      - run: npm run build --if-present
      - run: npm run lint
      - run: npm run test

      # main 브랜치에 푸시될 때만 GCP VM으로 배포(PR에서는 테스트만)
      - name: deploy to Google Cloud (SSH)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e
            # 비대화형 SSH 셸에서도 node/npm/pm2 를 찾도록 nvm 로드
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ~/project/discord_bot
            git fetch --all
            git reset --hard origin/main   # 원격과 강제 동기화(.env/static/json/node_modules 는 gitignore라 보존)
            # node_modules 는 건드리지 않는다(npx pm2가 그 안의 pm2를 사용하므로 npm ci로 지우면 pm2가 깨짐).
            # 의존성이 바뀐 경우엔 VM에서 npm install 을 수동 실행.
            npx --yes pm2 stop discord-bot || true
            npx --yes pm2 delete discord-bot || true       # 항목만 정리(데몬 kill 아님) → 같은 이름 start 충돌 방지
            npx --yes pm2 start npm --name discord-bot -- start
            npx --yes pm2 save
